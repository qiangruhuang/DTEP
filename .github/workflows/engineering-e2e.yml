name: Engineering + Product Browser E2E

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DTEP_TEST_OIDC_ISSUER: http://127.0.0.1:8091
      DTEP_TEST_OIDC_AUDIENCE: dtep-engineering
      DTEP_OIDC_ISSUER: http://127.0.0.1:8091
      DTEP_OIDC_AUDIENCE: dtep-engineering
      DTEP_OIDC_JWKS_URI: http://127.0.0.1:8091/jwks
      DTEP_AUTH_MODE: oidc
      DTEP_ALLOW_DEMO_ROLE_SWITCH: 'false'
      DTEP_SIGNING_MODE: remote-http
      DTEP_SIGNER_URL: http://127.0.0.1:8092
      DTEP_SIGNER_API_TOKEN: engineering-only-token
      DTEP_ADAPTER_DAEMON_URL: http://127.0.0.1:8093
      DTEP_REQUIRE_ENGINEERING_ADAPTERS: 'true'
      DATABASE_URL: file:${{ github.workspace }}/db/custom.db
      APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install JS dependencies
        run: bun ci
      - name: Install engineering Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn cryptography pydantic playwright
          python -m playwright install --with-deps chromium
      - name: Restore frozen synthetic demo database
        run: python scripts/restore_db.py --force
      - name: Generate Prisma client and build product
        run: |
          bunx prisma generate
          bun run build
      - name: Start OIDC, signer and executable adapter services
        shell: bash
        run: |
          set -euo pipefail
          python scripts/bootstrap_engineering_pki.py
          nohup python engineering/services/oidc_idp.py --serve --host 127.0.0.1 --port 8091 > /tmp/dtep-oidc.log 2>&1 &
          nohup python engineering/services/signing_service.py --host 127.0.0.1 --port 8092 > /tmp/dtep-signer.log 2>&1 &
          nohup python engineering/services/adapter_daemon.py --host 127.0.0.1 --port 8093 > /tmp/dtep-adapters.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for url in ['http://127.0.0.1:8091/health','http://127.0.0.1:8092/health','http://127.0.0.1:8093/health']:
              for _ in range(60):
                  try:
                      with urllib.request.urlopen(url, timeout=2) as r:
                          if r.status == 200:
                              break
                  except Exception:
                      time.sleep(.5)
              else:
                  raise SystemExit(f'service not healthy: {url}')
          PY
      - name: Run real Chromium engineering integration E2E
        run: python scripts/e2e/browser_engineering_v211.py
      - name: Start built DTEP product
        shell: bash
        run: |
          set -euo pipefail
          nohup bun run start > /tmp/dtep-app.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          url = 'http://127.0.0.1:3000/api/engineering/health'
          last = None
          for _ in range(120):
              try:
                  with urllib.request.urlopen(url, timeout=2) as r:
                      body = r.read().decode('utf-8', errors='replace')
                      last = f'{r.status} {body}'
                      if r.status == 200:
                          print(last)
                          break
              except Exception as exc:
                  last = repr(exc)
                  time.sleep(.5)
          else:
              raise SystemExit(f'DTEP app not healthy: {last}')
          PY
      - name: Run real Next.js product browser smoke in OIDC mode
        run: python scripts/e2e/github_product_smoke_v211.py
      - name: Upload browser evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtep-browser-e2e-${{ github.sha }}
          path: |
            BROWSER_E2E_v2.1.1.json
            BROWSER_E2E_v2.1.1.png
            GITHUB_PRODUCT_E2E_v2.1.1.json
            GITHUB_PRODUCT_E2E_v2.1.1.png
            /tmp/dtep-oidc.log
            /tmp/dtep-signer.log
            /tmp/dtep-adapters.log
            /tmp/dtep-app.log
          if-no-files-found: warn
