name: Bootstrap DTEP source tree

on:
  push:
    branches: [engineering/v2.1.2]
    paths:
      - 'bootstrap/dtep_core_source_v2.1.2.tar.gz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout engineering branch
        uses: actions/checkout@v4
        with:
          ref: engineering/v2.1.2
          fetch-depth: 0
      - name: Verify bootstrap archive exists
        run: test -f bootstrap/dtep_core_source_v2.1.2.tar.gz
      - name: Expand reviewed source archive
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf bootstrap/dtep_core_source_v2.1.2.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          test -f package.json
          test -f bun.lock
          test -f src/app/page.tsx
          test -f scripts/restore_db.py
          test -f db/custom.sql
      - name: Commit expanded source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'engineering: import DTEP v2.1.2 source baseline'
          git push origin HEAD:engineering/v2.1.2
