name: Engineering Performance Regression

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DTEP_TEST_OIDC_ISSUER: http://127.0.0.1:8091
      DTEP_TEST_OIDC_AUDIENCE: dtep-engineering
      DTEP_OIDC_ISSUER: http://127.0.0.1:8091
      DTEP_OIDC_AUDIENCE: dtep-engineering
      DTEP_OIDC_JWKS_URI: http://127.0.0.1:8091/jwks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun ci
      - name: Restore frozen synthetic demo database
        run: python scripts/restore_db.py --force
      - name: Install Python services
        run: python -m pip install fastapi uvicorn cryptography pydantic
      - name: Start services
        shell: bash
        run: |
          python scripts/bootstrap_engineering_pki.py
          nohup python engineering/services/oidc_idp.py --serve --host 127.0.0.1 --port 8091 >/tmp/dtep-oidc.log 2>&1 &
          nohup python engineering/services/signing_service.py --host 127.0.0.1 --port 8092 >/tmp/dtep-signer.log 2>&1 &
          nohup python engineering/services/adapter_daemon.py --host 127.0.0.1 --port 8093 >/tmp/dtep-adapters.log 2>&1 &
          sleep 3
      - name: Run performance baseline/regression
        run: python scripts/perf_v211.py
      - name: Upload performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: dtep-performance-${{ github.sha }}
          path: |
            PERFORMANCE_v2.1.1.json
            PERFORMANCE_v2.1.1.md
