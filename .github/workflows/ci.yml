name: DTEP CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-architecture-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install JS dependencies from frozen lockfile
        run: bun ci
      - name: Restore frozen synthetic demo database
        run: python scripts/restore_db.py --force
      - name: Prisma generate
        run: bunx prisma generate
      - name: Frozen architecture / evidence audit
        run: python scripts/validate_v21.py
      - name: TypeScript typecheck
        run: bunx tsc --noEmit
      - name: ESLint
        run: bun run lint
      - name: Next.js production build
        run: bun run build
      - name: Record build evidence
        shell: bash
        run: |
          mkdir -p ci-evidence
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "node=$(node --version)"
            echo "bun=$(bun --version)"
            echo "python=$(python --version 2>&1)"
            sha256sum ARCHITECTURE_FREEZE_v2.1.json END_TO_END_DEMO_v2.1.json db/custom.db
          } | tee ci-evidence/build-evidence.txt
      - name: Upload CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: dtep-ci-evidence-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: error
