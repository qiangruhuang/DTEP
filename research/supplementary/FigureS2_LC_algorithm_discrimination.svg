<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">LC-01 algorithm discrimination outside the legacy envelope</title>
<desc id="desc">Old-envelope comparison shows 12 of 16 normalized-equivalent and 4 of 16 different traces; a constructed maneuver challenge produces material CV versus CA differences.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}.panel{font-size:27px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.box{fill:#fff;stroke:#475569;stroke-width:1.8}.same{fill:#eef4f8;stroke:#355f7c;stroke-width:1.6}.diff{fill:#fff4f0;stroke:#9a3412;stroke-width:1.6}.metric{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.4}.accent{fill:#355f7c;font-weight:700}.warning{fill:#9a3412;font-weight:700}.muted{fill:#64748b}
</style></defs>
<text x="70" y="70" class="panel">A</text>
<text x="370" y="70" text-anchor="middle" class="head">Legacy E2 envelope</text>
<text x="370" y="105" text-anchor="middle" class="body">Both implementations execute all 16 cases</text>
<rect x="100" y="150" width="540" height="420" rx="16" class="box"/>
<text x="370" y="190" text-anchor="middle" class="head">Normalized CV–CA trace comparison</text>

<!-- 4 x 4 grid: 12 same, 4 different -->
<g>
<rect x="160" y="235" width="90" height="70" rx="7" class="same"/><rect x="270" y="235" width="90" height="70" rx="7" class="same"/><rect x="380" y="235" width="90" height="70" rx="7" class="same"/><rect x="490" y="235" width="90" height="70" rx="7" class="diff"/>
<rect x="160" y="325" width="90" height="70" rx="7" class="same"/><rect x="270" y="325" width="90" height="70" rx="7" class="same"/><rect x="380" y="325" width="90" height="70" rx="7" class="same"/><rect x="490" y="325" width="90" height="70" rx="7" class="diff"/>
<rect x="160" y="415" width="90" height="70" rx="7" class="same"/><rect x="270" y="415" width="90" height="70" rx="7" class="same"/><rect x="380" y="415" width="90" height="70" rx="7" class="same"/><rect x="490" y="415" width="90" height="70" rx="7" class="diff"/>
<rect x="160" y="505" width="90" height="70" rx="7" class="same"/><rect x="270" y="505" width="90" height="70" rx="7" class="same"/><rect x="380" y="505" width="90" height="70" rx="7" class="same"/><rect x="490" y="505" width="90" height="70" rx="7" class="diff"/>
</g>
<g font-size="16" text-anchor="middle"><text x="205" y="278">same</text><text x="315" y="278">same</text><text x="425" y="278">same</text><text x="535" y="278" class="warning">diff</text><text x="205" y="368">same</text><text x="315" y="368">same</text><text x="425" y="368">same</text><text x="535" y="368" class="warning">diff</text><text x="205" y="458">same</text><text x="315" y="458">same</text><text x="425" y="458">same</text><text x="535" y="458" class="warning">diff</text><text x="205" y="548">same</text><text x="315" y="548">same</text><text x="425" y="548">same</text><text x="535" y="548" class="warning">diff</text></g>
<text x="370" y="618" text-anchor="middle" class="body accent">12/16 normalized-equivalent; 4/16 different</text>
<text x="370" y="648" text-anchor="middle" class="small muted">Old-envelope survival alone is not an inheritance rule.</text>

<text x="820" y="70" class="panel">B</text>
<text x="1110" y="70" text-anchor="middle" class="head">Constructed maneuver challenge</text>
<text x="1110" y="105" text-anchor="middle" class="body">Accelerating target used only as an algorithm-discrimination control</text>
<rect x="790" y="150" width="620" height="420" rx="16" class="box"/>
<rect x="850" y="220" width="500" height="110" rx="11" class="metric"/>
<text x="1100" y="260" text-anchor="middle" class="body">Maximum absolute CV–CA range difference</text>
<text x="1100" y="303" text-anchor="middle" class="head warning">109.0755 m</text>
<rect x="850" y="365" width="500" height="110" rx="11" class="metric"/>
<text x="1100" y="405" text-anchor="middle" class="body">Maximum absolute CV–CA range-rate difference</text>
<text x="1100" y="448" text-anchor="middle" class="head warning">67.6108 m/s</text>
<text x="1100" y="520" text-anchor="middle" class="small muted">20 km initial range · 20° azimuth · 150 m/s closing · 15 m/s² acceleration</text>

<rect x="210" y="730" width="1080" height="105" rx="13" class="metric"/>
<text x="750" y="770" text-anchor="middle" class="head">Lifecycle interpretation</text>
<text x="750" y="806" text-anchor="middle" class="body"><tspan class="warning">Automatic implementation-specific inheritance rejected.</tspan><tspan> Unaffected evidence remains reusable.</tspan></text>
<text x="750" y="832" text-anchor="middle" class="small muted">Sensitivity result only; it does not establish operational superiority of CA over CV.</text>
</svg>