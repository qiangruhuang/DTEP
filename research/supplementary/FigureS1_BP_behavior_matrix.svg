</g>
<g class="small" text-anchor="middle">
<text x="630" y="328">D_byte = 0</text><text x="860" y="328">D_byte = 0</text><text x="1090" y="328">D_byte = 0</text><text x="1320" y="328">D_byte = 0</text>
<text x="630" y="453">D_byte = 0</text><text x="860" y="453">D_byte = 0</text><text x="1090" y="453">D_byte = 0</text><text x="1320" y="453">D_byte = 0</text>
<text x="630" y="578">D_byte = 0</text><text x="860" y="578">D_byte = 0</text><text x="1090" y="578">D_byte = 0</text><text x="1320" y="578">D_byte = 0</text>
<text x="630" y="703">D_byte = 0</text><text x="860" y="703">D_byte = 0</text><text x="1090" y="703">D_byte = 0</text><text x="1320" y="703">D_byte = 0</text>
</g>
<rect x="315" y="790" width="870" height="72" rx="10" class="lab"/>
<text x="750" y="821" text-anchor="middle" class="body accent">16/16 preserved; all scenarios produced behavior-bearing native tracks</text>
<text x="750" y="848" text-anchor="middle" class="small">Bounded wrapper-transparency evidence only; no hidden-state or universal equivalence claim.</text>
