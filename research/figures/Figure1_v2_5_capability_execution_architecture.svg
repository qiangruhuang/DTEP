<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">Capability-based heterogeneous model organization</title>
<desc id="desc">Upper trial logic addresses a SAL-aligned TMSU capability boundary, with OpenEaagles, RadarSimPublic, and an FMI Co-Simulation micro-demonstration below it.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.mono{font-family:'Courier New',monospace;font-size:16px}.box{fill:#ffffff;stroke:#334155;stroke-width:2}.soft{fill:#f8fafc;stroke:#64748b;stroke-width:1.8}.accent{fill:#eef4f8;stroke:#355f7c;stroke-width:2}.dash{fill:#ffffff;stroke:#355f7c;stroke-width:2;stroke-dasharray:8 6}.arr{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.strong{font-weight:700;fill:#355f7c}.rule{stroke:#cbd5e1;stroke-width:1.2}</style></defs>
<text x="800" y="52" text-anchor="middle" class="title">Capability boundary over heterogeneous execution mechanisms</text>
<rect x="470" y="82" width="660" height="100" rx="16" class="box"/><text x="800" y="120" text-anchor="middle" class="head">Upper trial / scenario logic</text><text x="800" y="153" text-anchor="middle" class="body">Frozen trial-facing logic requests a capability, not a concrete model API</text><path d="M800 182 L800 238" class="arr"/>
<rect x="220" y="238" width="1160" height="210" rx="22" class="dash"/><text x="800" y="280" text-anchor="middle" class="head">SAL-aligned TMSU capability / conformance boundary</text><text x="800" y="312" text-anchor="middle" class="body">contract + semantics + binding + provenance + intended use + evidence links</text>
<rect x="310" y="344" width="280" height="58" rx="10" class="accent"/><rect x="660" y="344" width="280" height="58" rx="10" class="accent"/><rect x="1010" y="344" width="280" height="58" rx="10" class="accent"/><text x="450" y="380" text-anchor="middle" class="mono">Capability_ID</text><text x="800" y="380" text-anchor="middle" class="mono">Contract_ID</text><text x="1150" y="380" text-anchor="middle" class="mono">Semantic_Profile_ID</text><text x="800" y="430" text-anchor="middle" class="body strong">Capability_ID ≠ Implementation_ID</text>
<path d="M465 448 L320 540" class="arr"/><path d="M800 448 L800 540" class="arr"/><path d="M1135 448 L1280 540" class="arr"/>
<rect x="70" y="540" width="470" height="245" rx="18" class="soft"/><text x="305" y="582" text-anchor="middle" class="head">OpenEaagles TWS + AirTrkMgr</text><text x="305" y="614" text-anchor="middle" class="body">Legacy C++ implementation · M1 Wrap</text><line x1="105" y1="638" x2="505" y2="638" class="rule"/><text x="110" y="675" class="body">Native execution preserved</text><text x="110" y="708" class="body">Distinct implementation identity</text><text x="110" y="741" class="small strong">BP-01: 16/16 exact wrapper preservation</text>
<rect x="565" y="540" width="470" height="245" rx="18" class="soft"/><text x="800" y="582" text-anchor="middle" class="head">RadarSimPublic</text><text x="800" y="614" text-anchor="middle" class="body">Python/NumPy · M2 Adapt</text><line x1="600" y1="638" x2="1000" y2="638" class="rule"/><text x="605" y="675" class="body">Adapter invokes upstream model components</text><text x="605" y="708" class="body">Upper trial unchanged on binding swap</text><text x="605" y="741" class="small strong">MS-01: 16/16 + 16/16 under frozen trial</text>
<rect x="1060" y="540" width="470" height="245" rx="18" class="soft"/><text x="1295" y="582" text-anchor="middle" class="head">FMI 3 Co-Simulation</text><text x="1295" y="614" text-anchor="middle" class="body">Reference FMU · M3 Native micro-demo</text><line x1="1095" y1="638" x2="1495" y2="638" class="rule"/><text x="1100" y="675" class="body">Standard execution + model metadata</text><text x="1100" y="708" class="body">T&amp;E-only declarations supplied separately</text><text x="1100" y="741" class="small strong">FMI-01: FMI 3.0 execution path PASS</text>
<rect x="220" y="825" width="1160" height="92" rx="14" class="accent"/><text x="800" y="860" text-anchor="middle" class="body strong">TMSU governs the trial-facing capability; execution mechanisms remain implementation-specific.</text><text x="800" y="892" text-anchor="middle" class="small">FMI branch = transport/conformance micro-demonstration; no broad second-capability fidelity claim</text>
</svg>