<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">FMI metadata and T&amp;E governance</title><desc id="desc">Machine-readable FMI metadata maps variables and units, while a TMSU sidecar provides T&amp;E capability identity, domain semantics, intended use, evidence state, and dependencies.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.mono{font-family:'Courier New',monospace;font-size:16px}.box{fill:#ffffff;stroke:#334155;stroke-width:2}.soft{fill:#f8fafc;stroke:#64748b;stroke-width:1.8}.accent{fill:#eef4f8;stroke:#355f7c;stroke-width:2}.dash{fill:#ffffff;stroke:#355f7c;stroke-width:2;stroke-dasharray:8 6}.arr{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.strong{font-weight:700;fill:#355f7c}.muted{fill:#64748b}</style></defs>
<text x="800" y="52" text-anchor="middle" class="title">FMI metadata versus T&amp;E-specific governance</text>
<rect x="70" y="95" width="600" height="690" rx="20" class="soft"/><text x="370" y="140" text-anchor="middle" class="head">Machine-readable FMI 3.0</text><text x="370" y="173" text-anchor="middle" class="small">Reference-FMUs v0.0.40 · Co-Simulation</text>
<rect x="125" y="210" width="490" height="165" rx="12" class="box"/><text x="160" y="246" class="body strong">modelDescription.xml</text><text x="160" y="282" class="body">FMI version / interface type</text><text x="160" y="314" class="body">variables · types · causality · units</text><text x="160" y="346" class="body">Position / Velocity / Acceleration</text>
<rect x="125" y="410" width="490" height="180" rx="12" class="accent"/><text x="370" y="450" text-anchor="middle" class="head">Frozen canonical mapping</text><text x="180" y="498" class="mono">h  : Position [m]</text><text x="455" y="498" class="mono">→ height_m</text><text x="180" y="546" class="mono">v  : Velocity [m/s]</text><text x="455" y="546" class="mono">→ vertical_velocity_mps</text>
<rect x="125" y="625" width="490" height="115" rx="12" class="box"/><text x="370" y="665" text-anchor="middle" class="body strong">FMI-01 execution</text><text x="370" y="698" text-anchor="middle" class="body">101 rows · 0–1 s · M3 criteria 4/4 PASS</text>
<path d="M670 440 L800 440" class="arr"/><text x="735" y="425" text-anchor="middle" class="small">binding</text>
<rect x="930" y="95" width="600" height="690" rx="20" class="dash"/><text x="1230" y="140" text-anchor="middle" class="head">TMSU / T&amp;E sidecar increment</text><text x="1230" y="173" text-anchor="middle" class="small">Declarations required by the frozen capability/evidence model</text>
<rect x="985" y="210" width="490" height="470" rx="12" class="box"/><text x="1030" y="255" class="body strong">Capability identity</text><text x="1030" y="300" class="body strong">Contract identity</text><text x="1030" y="345" class="body strong">Domain concept identity</text><text x="1030" y="390" class="body strong">Reference frame / sign convention</text><text x="1030" y="435" class="body strong">Intended-use boundary</text><text x="1030" y="480" class="body strong">Qualification / evidence state</text><text x="1030" y="525" class="body strong">Typed evidence dependencies</text><text x="1030" y="570" class="body strong">Provenance policy</text><text x="1030" y="625" class="small muted">Supplied where standardized model metadata does not establish</text><text x="1030" y="650" class="small muted">the T&amp;E declaration used by the study.</text>
<rect x="220" y="825" width="1160" height="92" rx="14" class="accent"/><text x="800" y="861" text-anchor="middle" class="body strong">Standard execution/model metadata and T&amp;E governance occupy different responsibility layers.</text><text x="800" y="893" text-anchor="middle" class="small">FMI-01 tests the binding mechanism; it does not validate motion-model fitness.</text>
</svg>