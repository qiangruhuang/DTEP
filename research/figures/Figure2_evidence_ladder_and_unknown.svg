<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.box{fill:#fff;stroke:#222;stroke-width:2}.soft{fill:#f4f4f4;stroke:#666;stroke-width:1.4}.unk{fill:#fff;stroke:#111;stroke-width:2.4;stroke-dasharray:7 5}.fail{fill:#ededed;stroke:#111;stroke-width:2.4}.arrow{stroke:#222;stroke-width:2.1;fill:none;marker-end:url(#a)}.u{stroke:#111;stroke-width:2.4;fill:none;stroke-dasharray:6 5;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs>
<text x="750" y="46" text-anchor="middle" class="t">Figure 2. Evidence ladder: each gate removes a stronger unjustified inference</text>
<text x="370" y="82" text-anchor="middle" class="s">main evidence chain</text><text x="1170" y="82" text-anchor="middle" class="s">durable uncertainty strand</text>
<rect x="160" y="110" width="420" height="86" rx="12" class="box"/><text x="370" y="143" text-anchor="middle" class="h">BP-01 — Preserve</text><text x="370" y="172" text-anchor="middle" class="b">OpenEaagles wrapper: 16/16 exact</text>
<path d="M370 196 L370 230" class="arrow"/><rect x="160" y="230" width="420" height="86" rx="12" class="box"/><text x="370" y="263" text-anchor="middle" class="h">MS-01 — Substitute</text><text x="370" y="292" text-anchor="middle" class="b">OpenEaagles 16/16; RadarSimPublic 16/16</text>
<path d="M370 316 L370 350" class="arrow"/><rect x="160" y="350" width="420" height="100" rx="12" class="box"/><text x="370" y="383" text-anchor="middle" class="h">SP-01 — Qualify semantics</text><text x="370" y="412" text-anchor="middle" class="b">5/5 injected mismatches rejected</text><text x="370" y="438" text-anchor="middle" class="b">real RF relation = UNKNOWN</text>
<path d="M370 450 L370 484" class="arrow"/><rect x="160" y="484" width="420" height="100" rx="12" class="box"/><text x="370" y="517" text-anchor="middle" class="h">EQ-01 — Qualify intended use</text><text x="370" y="546" text-anchor="middle" class="b">kinematic use = QUALIFIED_WITHIN_EVIDENCE</text><text x="370" y="572" text-anchor="middle" class="b">RF-performance use = UNKNOWN</text>
<path d="M370 584 L370 618" class="arrow"/><rect x="160" y="618" width="420" height="92" rx="12" class="box"/><text x="370" y="651" text-anchor="middle" class="h">EA-01 — Accumulate</text><text x="370" y="680" text-anchor="middle" class="b">history retained; applicability selective</text>
<path d="M370 710 L370 744" class="arrow"/><rect x="160" y="744" width="420" height="92" rx="12" class="fail"/><text x="370" y="777" text-anchor="middle" class="h">VU-01a — Comparator failure</text><text x="370" y="806" text-anchor="middle" class="b">strict byte identity: 8/16 → FAIL</text>
<path d="M370 836 L370 866" class="arrow"/><rect x="160" y="866" width="420" height="92" rx="12" class="box"/><text x="370" y="899" text-anchor="middle" class="h">VU-01b — Typed carry-forward</text><text x="370" y="928" text-anchor="middle" class="b">16/16 normalized + negative control rejected</text>
<rect x="735" y="866" width="420" height="92" rx="12" class="box"/><text x="945" y="899" text-anchor="middle" class="h">LC-01 — Stop rule</text><text x="945" y="928" text-anchor="middle" class="b">algorithm change → inheritance rejected</text><path d="M580 912 L735 912" class="arrow"/>
<rect x="975" y="350" width="390" height="82" rx="12" class="unk"/><text x="1170" y="382" text-anchor="middle" class="h">RF semantic state</text><text x="1170" y="411" text-anchor="middle" class="b">UNKNOWN</text>
<path d="M1170 432 L1170 500" class="u"/><rect x="975" y="500" width="390" height="82" rx="12" class="unk"/><text x="1170" y="532" text-anchor="middle" class="h">RF intended use</text><text x="1170" y="561" text-anchor="middle" class="b">UNKNOWN</text>
<path d="M1170 582 L1170 636" class="u"/><rect x="975" y="636" width="390" height="68" rx="12" class="unk"/><text x="1170" y="678" text-anchor="middle" class="b">UNKNOWN retained through EA-01</text>
<path d="M1170 704 L1170 754" class="u"/><rect x="975" y="754" width="390" height="68" rx="12" class="unk"/><text x="1170" y="796" text-anchor="middle" class="b">UNKNOWN retained through VU-01b</text>
<path d="M1170 822 L1170 866" class="u"/><rect x="975" y="866" width="390" height="92" rx="12" class="unk"/><text x="1170" y="899" text-anchor="middle" class="h">LC-01 does not erase it</text><text x="1170" y="928" text-anchor="middle" class="b">RF state remains UNKNOWN</text>
