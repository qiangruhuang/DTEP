<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111} .t{font-size:30px;font-weight:700}.h{font-size:23px;font-weight:700}.b{font-size:19px}.s{font-size:16px}.box{fill:#fff;stroke:#222;stroke-width:2}.soft{fill:#f5f5f5;stroke:#555;stroke-width:1.6}.dash{fill:#fff;stroke:#555;stroke-width:2;stroke-dasharray:8 6}.arrow{stroke:#222;stroke-width:2.5;fill:none;marker-end:url(#a)} .thin{stroke:#777;stroke-width:1.6;fill:none;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs>
<text x="700" y="48" text-anchor="middle" class="t">Figure 1. TMSU unifies heterogeneous model implementations at a stable trial-facing capability boundary</text>
<rect x="470" y="90" width="460" height="120" rx="14" class="box"/><text x="700" y="126" text-anchor="middle" class="h">Upper trial / scenario logic</text><text x="700" y="160" text-anchor="middle" class="b">frozen trial specification + orchestrator</text><text x="700" y="188" text-anchor="middle" class="s">does not encode concrete model internals</text>
<path d="M700 210 L700 270" class="arrow"/>
<rect x="305" y="270" width="790" height="175" rx="16" class="dash"/><text x="700" y="306" text-anchor="middle" class="h">SAL-aligned Test Model Service Unit (TMSU)</text><text x="700" y="338" text-anchor="middle" class="b">logical packaging / conformance unit — not runtime middleware</text>
<rect x="355" y="360" width="210" height="55" rx="8" class="soft"/><text x="460" y="394" text-anchor="middle" class="b">Capability_ID</text><rect x="595" y="360" width="210" height="55" rx="8" class="soft"/><text x="700" y="394" text-anchor="middle" class="b">Contract_ID</text><rect x="835" y="360" width="210" height="55" rx="8" class="soft"/><text x="940" y="394" text-anchor="middle" class="b">Semantic_Profile_ID</text>
<text x="700" y="438" text-anchor="middle" class="b">Capability_ID ≠ Implementation_ID</text>
<path d="M520 445 L350 520" class="arrow"/><path d="M880 445 L1050 520" class="arrow"/>
<rect x="110" y="520" width="480" height="225" rx="16" class="box"/><text x="350" y="558" text-anchor="middle" class="h">Implementation A — OpenEaagles TWS</text><text x="350" y="592" text-anchor="middle" class="b">legacy C++ implementation</text><text x="145" y="635" class="b">• distinct Implementation_ID</text><text x="145" y="668" class="b">• wrapper / binding</text><text x="145" y="701" class="b">• provenance + evidence links</text><text x="145" y="734" class="s">BP-01: 16/16 preserved</text>
<rect x="810" y="520" width="480" height="225" rx="16" class="box"/><text x="1050" y="558" text-anchor="middle" class="h">Implementation B — RadarSimPublic</text><text x="1050" y="592" text-anchor="middle" class="b">independent Python / NumPy implementation</text><text x="845" y="635" class="b">• distinct Implementation_ID</text><text x="845" y="668" class="b">• adapter / binding</text><text x="845" y="701" class="b">• provenance + evidence links</text><text x="845" y="734" class="s">MS-01: 16/16 execution</text>
<path d="M590 632 L810 632" class="thin"/><text x="700" y="615" text-anchor="middle" class="s">same trial-facing capability contract</text><text x="700" y="665" text-anchor="middle" class="s">different internal architectures and behavior</text>
<rect x="250" y="790" width="900" height="72" rx="12" class="soft"/><text x="700" y="820" text-anchor="middle" class="b">Empirical substitution result: change binding, not upper trial logic</text><text x="700" y="848" text-anchor="middle" class="s">OpenEaagles 16/16 PASS; RadarSimPublic 16/16 PASS; upper-trial modifications = 0</text>
</svg>