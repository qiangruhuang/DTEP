<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">Cumulative evidence and typed selective staleness</title><desc id="desc">Evidence history stays append-only while current evidence states change through provenance, execution environment, and algorithm revisions. ENV-01 shows ACTIVE to STALE and bounded delta restoration.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.mono{font-family:'Courier New',monospace;font-size:16px}.box{fill:#ffffff;stroke:#334155;stroke-width:2}.soft{fill:#f8fafc;stroke:#64748b;stroke-width:1.8}.accent{fill:#eef4f8;stroke:#355f7c;stroke-width:2}.arr{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.line{stroke:#64748b;stroke-width:1.6;fill:none}.strong{font-weight:700;fill:#355f7c}</style></defs>
<text x="800" y="52" text-anchor="middle" class="title">Cumulative evidence with typed selective staleness</text>
<text x="105" y="108" class="head">Configuration sequence</text>
<rect x="105" y="135" width="300" height="75" rx="12" class="soft"/><text x="255" y="179" text-anchor="middle" class="body">C0 · baseline</text><path d="M405 173 L505 173" class="arr"/><rect x="505" y="135" width="300" height="75" rx="12" class="soft"/><text x="655" y="166" text-anchor="middle" class="body">C1 · provenance</text><text x="655" y="191" text-anchor="middle" class="small">VU-01</text><path d="M805 173 L905 173" class="arr"/><rect x="905" y="135" width="300" height="75" rx="12" class="accent"/><text x="1055" y="166" text-anchor="middle" class="body strong">C2 · runtime</text><text x="1055" y="191" text-anchor="middle" class="small">ENV-01</text><path d="M1205 173 L1305 173" class="arr"/><rect x="1305" y="135" width="210" height="75" rx="12" class="soft"/><text x="1410" y="166" text-anchor="middle" class="body">C3 · CV→CA</text><text x="1410" y="191" text-anchor="middle" class="small">LC-01</text>
<text x="105" y="285" class="head">Historical evidence lane</text><line x1="150" y1="330" x2="1450" y2="330" class="line"/><circle cx="255" cy="330" r="17" class="accent"/><circle cx="655" cy="330" r="17" class="accent"/><circle cx="1055" cy="330" r="17" class="accent"/><circle cx="1410" cy="330" r="17" class="accent"/><text x="255" y="370" text-anchor="middle" class="small">BP/MS/SP/EQ/EA</text><text x="655" y="370" text-anchor="middle" class="small">+ VU evidence</text><text x="1055" y="370" text-anchor="middle" class="small">+ ENV evidence</text><text x="1410" y="370" text-anchor="middle" class="small">+ LC evidence</text><text x="800" y="410" text-anchor="middle" class="body strong">No historical evidence node is deleted.</text>
<text x="105" y="490" class="head">Current applicability lane</text>
<rect x="115" y="525" width="280" height="110" rx="12" class="box"/><text x="255" y="565" text-anchor="middle" class="body strong">ACTIVE</text><text x="255" y="600" text-anchor="middle" class="small">baseline claims within evidence</text>
<rect x="515" y="525" width="280" height="110" rx="12" class="box"/><text x="655" y="558" text-anchor="middle" class="body">STALE → restored</text><text x="655" y="590" text-anchor="middle" class="small">typed VU delta evidence</text><text x="655" y="615" text-anchor="middle" class="small strong">PASS_CARRIED_FORWARD...</text>
<rect x="915" y="505" width="340" height="150" rx="12" class="accent"/><text x="1085" y="540" text-anchor="middle" class="body strong">ENV dependency hit</text><text x="1085" y="574" text-anchor="middle" class="mono">ACTIVE → STALE</text><text x="1085" y="606" text-anchor="middle" class="small">repeat/equivalence delta PASS</text><text x="1085" y="632" text-anchor="middle" class="small strong">affected claim → ACTIVE</text>
<rect x="1320" y="525" width="210" height="110" rx="12" class="box"/><text x="1425" y="558" text-anchor="middle" class="body">STALE / UNKNOWN</text><text x="1425" y="590" text-anchor="middle" class="small">fresh affected fitness</text><text x="1425" y="615" text-anchor="middle" class="small">required after LC</text>
<rect x="250" y="700" width="1100" height="150" rx="16" class="soft"/><text x="800" y="740" text-anchor="middle" class="head">ENV-01 selective propagation</text><text x="800" y="780" text-anchor="middle" class="mono">Dep(E_execution) ∩ Δ(C) = {EXECUTION_ENVIRONMENT}</text><text x="800" y="815" text-anchor="middle" class="body">execution evidence: ACTIVE → STALE → ACTIVE with delta evidence</text><text x="800" y="843" text-anchor="middle" class="body">semantic control: ACTIVE → ACTIVE (dependency intersection empty)</text>
<text x="800" y="915" text-anchor="middle" class="body strong">Evidence history is provenance-monotonic; current qualification is not monotonic.</text>
</svg>