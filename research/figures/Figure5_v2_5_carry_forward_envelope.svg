<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">Carry-forward envelope and stopping rule</title><desc id="desc">VU provenance change and ENV runtime change support bounded delta restoration, while LC algorithm identity change rejects automatic qualification inheritance.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.mono{font-family:'Courier New',monospace;font-size:16px}.soft{fill:#f8fafc;stroke:#64748b;stroke-width:1.8}.accent{fill:#eef4f8;stroke:#355f7c;stroke-width:2}.arr{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.strong{font-weight:700;fill:#355f7c}.muted{fill:#64748b}.rule{stroke:#cbd5e1;stroke-width:1.2}</style></defs>
<text x="800" y="52" text-anchor="middle" class="title">Tested carry-forward envelope and stopping rule</text>
<rect x="60" y="100" width="470" height="700" rx="20" class="soft"/><text x="295" y="142" text-anchor="middle" class="head">A · VU provenance revision</text><text x="100" y="190" class="body">Model identity unchanged</text><text x="100" y="225" class="body">Semantics / upper trial unchanged</text><line x1="100" y1="250" x2="490" y2="250" class="rule"/><text x="100" y="295" class="body">Strict byte rule</text><text x="440" y="295" text-anchor="end" class="body strong">8/16 exact · FAIL</text><path d="M295 320 L295 370" class="arr"/><text x="100" y="410" class="body">Typed numerical comparator</text><text x="440" y="410" text-anchor="end" class="body strong">16/16 · PASS</text><text x="100" y="450" class="body">+1e-6 m control</text><text x="440" y="450" text-anchor="end" class="body strong">rejected</text><rect x="105" y="520" width="380" height="105" rx="12" class="accent"/><text x="295" y="558" text-anchor="middle" class="body strong">Selective carry-forward</text><text x="295" y="590" text-anchor="middle" class="small">affected provenance path restored</text><text x="295" y="735" text-anchor="middle" class="small muted">Bounded positive envelope</text>
<rect x="565" y="100" width="470" height="700" rx="20" class="soft"/><text x="800" y="142" text-anchor="middle" class="head">B · ENV runtime revision</text><text x="605" y="190" class="body">fmusim 0.9.0 → 0.10.0</text><text x="605" y="225" class="body">same FMU + same hosted runner</text><line x1="605" y1="250" x2="995" y2="250" class="rule"/><text x="605" y="295" class="body">Same-machine repeat</text><text x="945" y="295" text-anchor="end" class="body strong">10/10 + 10/10 stable</text><text x="605" y="335" class="body">Cross-runtime comparison</text><text x="945" y="335" text-anchor="end" class="body strong">max diff = 0</text><text x="605" y="375" class="body">+1e-6 control</text><text x="945" y="375" text-anchor="end" class="body strong">rejected</text><path d="M800 405 L800 465" class="arr"/><text x="605" y="505" class="mono">ACTIVE → STALE</text><text x="605" y="540" class="small">dependency hit precedes comparison</text><rect x="610" y="580" width="380" height="105" rx="12" class="accent"/><text x="800" y="618" text-anchor="middle" class="body strong">Delta restoration</text><text x="800" y="650" text-anchor="middle" class="small">affected execution claim only</text><text x="800" y="735" text-anchor="middle" class="small muted">Bounded positive envelope</text>
<rect x="1070" y="100" width="470" height="700" rx="20" class="soft"/><text x="1305" y="142" text-anchor="middle" class="head">C · LC algorithm / identity change</text><text x="1110" y="190" class="body">CV KF → CA KF</text><text x="1110" y="225" class="body">Implementation_ID changed</text><line x1="1110" y1="250" x2="1500" y2="250" class="rule"/><text x="1110" y="295" class="body">Old envelope execution</text><text x="1450" y="295" text-anchor="end" class="body strong">16/16 + 16/16</text><text x="1110" y="335" class="body">Normalized equal cases</text><text x="1450" y="335" text-anchor="end" class="body strong">12/16</text><text x="1110" y="390" class="body">Maneuver discrimination</text><text x="1110" y="425" class="small">max Δ range = 109.0755 m</text><text x="1110" y="452" class="small">max Δ range rate = 67.6108 m/s</text><path d="M1305 480 L1305 535" class="arr"/><rect x="1115" y="560" width="380" height="125" rx="12" class="accent"/><text x="1305" y="598" text-anchor="middle" class="body strong">Automatic inheritance rejected</text><text x="1305" y="631" text-anchor="middle" class="small">fresh affected fitness evidence required</text><text x="1305" y="660" text-anchor="middle" class="small">historical / unaffected evidence retained</text><text x="1305" y="735" text-anchor="middle" class="small muted">Tested stopping rule</text>
<rect x="210" y="840" width="1180" height="82" rx="14" class="accent"/><text x="800" y="874" text-anchor="middle" class="body strong">Successful execution or an unchanged interface does not determine qualification inheritance.</text><text x="800" y="904" text-anchor="middle" class="small">Decision depends on change class, claim dependencies, and claim-appropriate evidence.</text>
</svg>