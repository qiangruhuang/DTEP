<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.box{fill:#fff;stroke:#222;stroke-width:2}.soft{fill:#f4f4f4;stroke:#666;stroke-width:1.4}.stale{fill:#fff;stroke:#777;stroke-width:1.8;stroke-dasharray:7 5}.unk{fill:#fff;stroke:#111;stroke-width:2.2;stroke-dasharray:5 5}.arrow{stroke:#222;stroke-width:2.2;fill:none;marker-end:url(#a)}.line{stroke:#444;stroke-width:2;fill:none}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs>
<text x="750" y="46" text-anchor="middle" class="t">Figure 3. Evidence history accumulates monotonically while qualification remains conditional</text>
<text x="230" y="100" class="h">A. Append-only evidence history</text>
<line x1="150" y1="165" x2="1350" y2="165" class="line"/>
<text x="250" y="145" text-anchor="middle" class="b">C0 — EA baseline</text><text x="750" y="145" text-anchor="middle" class="b">C1 — VU provenance revision</text><text x="1230" y="145" text-anchor="middle" class="b">C2 — LC algorithm change</text>
<rect x="120" y="205" width="260" height="62" rx="10" class="box"/><text x="250" y="244" text-anchor="middle" class="b">BP  MS  SP  EQ  EB</text>
<path d="M380 236 L610 236" class="arrow"/><rect x="610" y="205" width="280" height="62" rx="10" class="box"/><text x="750" y="244" text-anchor="middle" class="b">BP  MS  SP  EQ  EB  VU</text>
<path d="M890 236 L1060 236" class="arrow"/><rect x="1060" y="205" width="340" height="62" rx="10" class="box"/><text x="1230" y="244" text-anchor="middle" class="b">BP  MS  SP  EQ  EB  VU  LC</text>
<text x="750" y="308" text-anchor="middle" class="h">E(t+1) = E(t) ∪ ΔE</text><text x="750" y="336" text-anchor="middle" class="s">history is retained; later evidence does not overwrite earlier records</text>
<text x="230" y="405" class="h">B. Current applicability and qualification are recomputed</text>
<rect x="110" y="445" width="360" height="250" rx="14" class="soft"/><text x="290" y="480" text-anchor="middle" class="h">C0 current state</text><text x="140" y="525" class="b">BP / MS / SP / EQ / EB</text><text x="140" y="554" class="b">→ ACTIVE</text><text x="140" y="598" class="b">Kinematic use</text><text x="140" y="627" class="b">→ QUALIFIED_WITHIN_EVIDENCE</text><text x="140" y="671" class="b">RF relation/use → UNKNOWN</text>
<rect x="570" y="445" width="360" height="250" rx="14" class="soft"/><text x="750" y="480" text-anchor="middle" class="h">C1 after VU revision</text><text x="600" y="525" class="b">BP / SP → ACTIVE</text><text x="600" y="554" class="b">MS / EQ → delta reassessed</text><text x="600" y="598" class="b">Kinematic use</text><text x="600" y="627" class="b">→ restored by typed evidence</text><text x="600" y="671" class="b">RF relation/use → UNKNOWN</text>
<rect x="1030" y="445" width="360" height="250" rx="14" class="soft"/><text x="1210" y="480" text-anchor="middle" class="h">C2 after LC change</text><text x="1060" y="525" class="b">BP / SP → ACTIVE</text><text x="1060" y="554" class="b">CV-specific evidence → STALE</text><text x="1060" y="598" class="b">CA architecture → PASS_FRESH_EXECUTION</text><text x="1060" y="627" class="b">CA fitness → UNKNOWN_PENDING...</text><text x="1060" y="671" class="b">RF relation/use → UNKNOWN</text>
<path d="M470 570 L570 570" class="arrow"/><path d="M930 570 L1030 570" class="arrow"/>
<rect x="160" y="760" width="1180" height="150" rx="14" class="box"/><text x="750" y="797" text-anchor="middle" class="h">Core lifecycle principle</text><text x="750" y="838" text-anchor="middle" class="b">Evidence history is provenance-monotonic.</text><text x="750" y="872" text-anchor="middle" class="b">Qualification is not monotonic: it depends on implementation, intended use, configuration and applicable evidence.</text>
</svg>