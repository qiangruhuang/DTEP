<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">Three-arm baseline ablation</title><desc id="desc">Direct coupling, plain facade, and SAL/TMSU produce identical outputs. Plain facade and TMSU both isolate model APIs; only TMSU carries five tested T&amp;E governance controls.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.box{fill:#ffffff;stroke:#334155;stroke-width:2}.soft{fill:#f8fafc;stroke:#64748b;stroke-width:1.8}.accent{fill:#eef4f8;stroke:#355f7c;stroke-width:2}.strong{font-weight:700;fill:#355f7c}.muted{fill:#64748b}.rule{stroke:#cbd5e1;stroke-width:1.2}</style></defs>
<text x="800" y="52" text-anchor="middle" class="title">BL-01: direct coupling vs competent façade vs SAL/TMSU</text>
<rect x="70" y="90" width="450" height="315" rx="18" class="soft"/><text x="295" y="132" text-anchor="middle" class="head">A · Direct coupling</text><text x="105" y="178" class="body">Concrete model API in upper core</text><text x="105" y="216" class="body">Upper-core executable refs: <tspan class="strong">9</tspan></text><text x="105" y="254" class="body">Boundary nonblank lines: <tspan class="strong">0</tspan></text><text x="105" y="306" class="small">No separate façade boundary</text><text x="105" y="338" class="small">No TMSU governance package</text>
<rect x="575" y="90" width="450" height="315" rx="18" class="soft"/><text x="800" y="132" text-anchor="middle" class="head">B · Competent plain façade</text><text x="610" y="178" class="body">Concrete model API isolated at boundary</text><text x="610" y="216" class="body">Upper-core executable refs: <tspan class="strong">0</tspan></text><text x="610" y="254" class="body">Boundary nonblank lines: <tspan class="strong">71</tspan></text><text x="610" y="306" class="small">Deliberately strong software baseline</text><text x="610" y="338" class="small">No T&amp;E semantic/evidence governance</text>
<rect x="1080" y="90" width="450" height="315" rx="18" class="soft"/><text x="1305" y="132" text-anchor="middle" class="head">C · SAL/TMSU</text><text x="1115" y="178" class="body">Concrete model API isolated at boundary</text><text x="1115" y="216" class="body">Upper-core executable refs: <tspan class="strong">0</tspan></text><text x="1115" y="254" class="body">Boundary nonblank lines: <tspan class="strong">199</tspan></text><text x="1115" y="306" class="small">Adapter + binding + governance</text><text x="1115" y="338" class="small strong">T&amp;E controls attached</text>
<rect x="180" y="438" width="1240" height="78" rx="14" class="accent"/><text x="800" y="470" text-anchor="middle" class="body strong">Functional gate: 16/16 canonical outputs byte-identical across all three arms</text><text x="800" y="499" text-anchor="middle" class="small">Software-localization and governance comparisons follow functional equivalence</text>
<text x="800" y="563" text-anchor="middle" class="head">T&amp;E governance ablation</text>
<rect x="280" y="590" width="1040" height="260" rx="14" class="box"/><text x="330" y="626" class="body">Control</text><text x="840" y="626" text-anchor="middle" class="body">Direct</text><text x="1030" y="626" text-anchor="middle" class="body">Façade</text><text x="1220" y="626" text-anchor="middle" class="body">SAL/TMSU</text><line x1="310" y1="641" x2="1290" y2="641" class="rule"/>
<text x="330" y="676" class="body">Semantic profile</text><text x="840" y="676" text-anchor="middle" class="body">—</text><text x="1030" y="676" text-anchor="middle" class="body">—</text><text x="1220" y="676" text-anchor="middle" class="body strong">✓</text>
<text x="330" y="712" class="body">Explicit UNKNOWN</text><text x="840" y="712" text-anchor="middle" class="body">—</text><text x="1030" y="712" text-anchor="middle" class="body">—</text><text x="1220" y="712" text-anchor="middle" class="body strong">✓</text>
<text x="330" y="748" class="body">Intended-use gate</text><text x="840" y="748" text-anchor="middle" class="body">—</text><text x="1030" y="748" text-anchor="middle" class="body">—</text><text x="1220" y="748" text-anchor="middle" class="body strong">✓</text>
<text x="330" y="784" class="body">Typed evidence dependencies</text><text x="840" y="784" text-anchor="middle" class="body">—</text><text x="1030" y="784" text-anchor="middle" class="body">—</text><text x="1220" y="784" text-anchor="middle" class="body strong">✓</text>
