<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:30px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.box{fill:#fff;stroke:#222;stroke-width:2}.soft{fill:#f4f4f4;stroke:#555;stroke-width:1.6}.dash{fill:#fff;stroke:#666;stroke-width:1.8;stroke-dasharray:7 5}.arrow{stroke:#222;stroke-width:2.2;fill:none;marker-end:url(#a)}.divider{stroke:#777;stroke-width:2;stroke-dasharray:8 6}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs>
<text x="750" y="46" text-anchor="middle" class="t">Figure 4. Evidence inheritance needs both a carry-forward rule and a stop rule</text>
<line x1="750" y1="90" x2="750" y2="890" class="divider"/>
<text x="375" y="105" text-anchor="middle" class="h">A. VU-01b — controlled provenance revision</text><text x="1125" y="105" text-anchor="middle" class="h">B. LC-01 — substantive algorithm / identity change</text>
<rect x="105" y="145" width="540" height="120" rx="14" class="box"/><text x="375" y="180" text-anchor="middle" class="h">Change classification</text><text x="375" y="215" text-anchor="middle" class="b">adapter / binding provenance revision</text><text x="375" y="244" text-anchor="middle" class="s">model identity, contract, semantic mapping and upper trial unchanged</text>
<path d="M375 265 L375 315" class="arrow"/><rect x="105" y="315" width="540" height="130" rx="14" class="soft"/><text x="375" y="350" text-anchor="middle" class="h">Affected evidence action</text><text x="145" y="390" class="b">BP / SP: reuse</text><text x="145" y="420" class="b">MS / EQ: typed delta reassessment</text>
<path d="M375 445 L375 500" class="arrow"/><rect x="105" y="500" width="540" height="160" rx="14" class="box"/><text x="375" y="535" text-anchor="middle" class="h">Comparator-qualified result</text><text x="145" y="575" class="b">VU-01a: exact bytes 8/16 → FAIL</text><text x="145" y="607" class="b">VU-01b: normalized equivalence 16/16</text><text x="145" y="639" class="b">+1e-6 m perturbation → correctly rejected</text>
<path d="M375 660 L375 715" class="arrow"/><rect x="105" y="715" width="540" height="125" rx="14" class="box"/><text x="375" y="750" text-anchor="middle" class="h">Lifecycle decision</text><text x="375" y="790" text-anchor="middle" class="b">SELECTIVE CARRY-FORWARD ALLOWED</text><text x="375" y="818" text-anchor="middle" class="s">affected claims restored by evidence-type-appropriate delta evidence</text>
<rect x="855" y="145" width="540" height="120" rx="14" class="box"/><text x="1125" y="180" text-anchor="middle" class="h">Change classification</text><text x="1125" y="215" text-anchor="middle" class="b">CV KF → CA KF; Implementation_ID changes</text><text x="1125" y="244" text-anchor="middle" class="s">contract, semantic mapping and upper trial remain unchanged</text>
<path d="M1125 265 L1125 315" class="arrow"/><rect x="855" y="315" width="540" height="130" rx="14" class="soft"/><text x="1125" y="350" text-anchor="middle" class="h">Old-envelope evidence</text><text x="895" y="390" class="b">CV: 16/16 execute; CA: 16/16 execute</text><text x="895" y="420" class="b">normalized CV–CA equality: 12/16</text>
<path d="M1125 445 L1125 500" class="arrow"/><rect x="855" y="500" width="540" height="160" rx="14" class="box"/><text x="1125" y="535" text-anchor="middle" class="h">Discrimination control</text><text x="895" y="575" class="b">max |range_CA − range_CV| = 109.0755 m</text><text x="895" y="607" class="b">max |rate_CA − rate_CV| = 67.6108 m/s</text><text x="895" y="639" class="s">constructed maneuver challenge; not operational validation</text>
<path d="M1125 660 L1125 715" class="arrow"/><rect x="855" y="715" width="540" height="125" rx="14" class="box"/><text x="1125" y="750" text-anchor="middle" class="h">Lifecycle decision</text><text x="1125" y="790" text-anchor="middle" class="b">AUTOMATIC INHERITANCE REJECTED</text><text x="1125" y="818" text-anchor="middle" class="s">unaffected evidence stays active; fresh affected fitness evidence required</text>
<rect x="310" y="865" width="880" height="55" rx="10" class="dash"/><text x="750" y="900" text-anchor="middle" class="b">same contract ≠ same qualification; change class + evidence dependencies determine inheritance</text>
</svg>